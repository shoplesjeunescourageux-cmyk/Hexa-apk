name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copier la bibliothèque Supabase dans l'application
        run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
      - name: Rendre la bibliothèque compatible avec les anciens téléphones
        run: npx esbuild www/supabase.js --target=es2017 --allow-overwrite --outfile=www/supabase.js
      - run: npx cap add android
      - name: Installer ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Icône Hexa
        run: |
          R=android/app/src/main/res
          for s in "mdpi 108 48" "hdpi 162 72" "xhdpi 216 96" "xxhdpi 324 144" "xxxhdpi 432 192"; do
            set -- $s
            convert icon.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher_foreground.png
            convert icon.png -resize ${3}x${3} -background '#101428' -alpha remove -alpha off $R/mipmap-$1/ic_launcher.png
            cp $R/mipmap-$1/ic_launcher.png $R/mipmap-$1/ic_launcher_round.png
          done
          sed -i 's/#FFFFFF/#101428/' $R/values/ic_launcher_background.xml
      - name: Autoriser le micro et internet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hexa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
