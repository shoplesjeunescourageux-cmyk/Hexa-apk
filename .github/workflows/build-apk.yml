name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copier la bibliothèque Supabase dans l'application
        run: cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
      - name: Rendre la bibliothèque compatible avec les anciens téléphones
        run: npx esbuild www/supabase.js --target=es2017 --allow-overwrite --outfile=www/supabase.js
      - run: npx cap add android
      - name: Autoriser le micro et internet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hexa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
