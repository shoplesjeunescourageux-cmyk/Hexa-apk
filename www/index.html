<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;max-width:680px;margin:auto;padding-bottom:84px}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 12px;font:inherit}
button{background:var(--bl);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer}button.g{background:none;color:var(--mu);padding:6px 8px}button:disabled{opacity:.5}
h3{margin:0 0 var(--g);font-size:16px}.c{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:var(--g);margin:var(--g)}
.t{color:var(--mu);font-size:12px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}header h1{margin:0;font-size:24px;background:linear-gradient(90deg,var(--bl),var(--gr),var(--rd));-webkit-background-clip:text;background-clip:text;color:transparent}
img.p,video.p{width:100%;border-radius:12px;margin-top:8px;max-height:75vh;background:#000;object-fit:contain}.av{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:2px solid var(--gr);cursor:pointer;background:var(--bd)}.av.big{width:92px;height:92px;margin:0;border-width:3px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:auto;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:9px 2px;font-size:11px;line-height:1.3}nav button b{display:block;font-size:19px;font-weight:400}nav .on{color:var(--bl);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 var(--g)}.chips button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);white-space:nowrap;border-radius:20px;padding:7px 14px}.chips .on{background:var(--bl);color:#fff;border-color:var(--bl)}
.msg{padding:8px 12px;border-radius:14px;background:var(--bg);margin:6px 0;max-width:85%}.msg.me{background:var(--bl);color:#fff;margin-left:auto}
.badge{background:var(--rd);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:3px}.bn{background:linear-gradient(90deg,#1e6bff22,#12b76a22,#e5383b22);border-color:var(--gr)}
.tag{background:var(--bg);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--mu)}.lk{display:inline-block;margin:3px 4px 0 0;padding:5px 11px;border-radius:20px;background:var(--bg);color:var(--bl);text-decoration:none;font-size:13px;border:1px solid var(--bd)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.sw input{width:auto}
#auth{min-height:100vh;padding:24px 16px;background:radial-gradient(circle at 10% 5%,#1e6bff55,transparent 45%),radial-gradient(circle at 95% 25%,#e5383b44,transparent 40%),radial-gradient(circle at 50% 100%,#12b76a55,transparent 50%)}
#auth .box{max-width:480px;margin:auto;background:var(--cd);border-radius:22px;padding:20px;box-shadow:0 10px 40px #1e6bff33}#auth h2{text-align:center;margin:4px 0;background:linear-gradient(90deg,var(--bl),var(--gr),var(--rd));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px}
.big{width:100%;margin-top:14px;padding:13px;background:linear-gradient(90deg,var(--bl),var(--gr) 55%,var(--rd))}
#pf{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top)}
#ts{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--bl);color:#fff;padding:10px 16px;border-radius:20px;z-index:40;display:none;max-width:90%}.errbar{position:fixed;top:0;left:0;right:0;background:var(--rd);color:#fff;padding:10px;z-index:99;font-size:13px}
</style></head><body>
