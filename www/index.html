<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion Commerce</title>
<style>
:root{--card:#fff;--tx:#1f2a37;--mut:#5b6b7b;--bd:#e3eaf1;--ac:#0e9f6e;--ac2:#14b8a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{background:#e9f3f6}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(165deg,#dff5ec 0%,#e4eefc 48%,#fdeed9 100%)}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(31,42,55,.08)}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:0 0 8px}
input,select{width:100%;padding:11px 12px;border:1.5px solid #d5e0ea;border-radius:12px;background:#fff;color:var(--tx);font:inherit;margin-bottom:8px;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--ac);flex:none}
button{padding:11px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.12)}
button.s{background:#e8eef4;color:var(--tx);box-shadow:none}button.r{background:linear-gradient(135deg,#ef4444,#dc2626)}button.sm{padding:7px 11px;font-size:13px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 10px 24px rgba(0,0,0,.16)}
.hero h1{color:#fff}.hero .mut{color:rgba(255,255,255,.92)}.hero button.s{background:rgba(255,255,255,.26);color:#fff}.hero .av{border:2px solid rgba(255,255,255,.85)}
.top{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.35);flex:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:last-child{border:0}.g{flex:1;min-width:0}.mut{color:var(--mut);font-size:13px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button,.chips button{background:#fff;color:var(--tx);border:1.5px solid var(--bd);white-space:nowrap;box-shadow:none;padding:9px 14px;border-radius:99px}
.tabs button.on,.chips button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(0,0,0,.14)}
